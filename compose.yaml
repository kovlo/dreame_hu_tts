services:
  voice-pack:
    build:
      context: ./TTS voice creator
    working_dir: /workspace
    volumes:
      - type: bind
        source: ./TTS voice creator
        target: /workspace
      - type: bind
        source: ./dreame_voicepack_hu
        target: /base-packs
        read_only: true
    environment:
      SPEECH_KEY: ${SPEECH_KEY:-}
